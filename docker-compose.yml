services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - keycloak
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./secrets/tls.key:/etc/nginx/certs/tls.key:ro
    tmpfs:
      - /var/cache/nginx
      - /tmp
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /var/cache/nginx/client_temp /var/cache/nginx/proxy_temp /var/cache/nginx/fastcgi_temp /var/cache/nginx/uwsgi_temp /var/cache/nginx/scgi_temp && nginx -g "daemon off;"
    restart: unless-stopped

  realm-init:
    image: alpine:3.21
    volumes:
      - ./keycloak/realm-template.json:/template.json:ro
      - kc-import:/import
    secrets:
      - kc_client_secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s/__CLIENT_SECRET__/$$(cat /run/secrets/kc_client_secret)/" /template.json > /import/dip-realm.json && chmod 644 /import/dip-realm.json
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    depends_on:
      realm-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export KC_BOOTSTRAP_ADMIN_USERNAME=kcadmin; export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/kc_admin_password)"; exec /opt/keycloak/bin/kc.sh start --import-realm --http-enabled=true --hostname=https://localhost/auth --hostname-strict=false --proxy-headers=xforwarded
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    volumes:
      - ./keycloak/themes/dip:/opt/keycloak/themes/dip:ro
      - kc-import:/opt/keycloak/data/import:ro
      - kc-data:/opt/keycloak/data
    secrets:
      - kc_admin_password
    restart: unless-stopped

  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PUBLIC_BASE: https://localhost
      OIDC_INTERNAL: http://keycloak:8080/auth/realms/dip
      DATABASE_HOST: postgres
      DATABASE_NAME: dip
      DATABASE_USER: dip
    secrets:
      - postgres_password
      - kc_client_secret
      - session_secret
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dip
      POSTGRES_DB: dip
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dip -d dip"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  kc_admin_password:
    file: ./secrets/kc_admin_password
  kc_client_secret:
    file: ./secrets/kc_client_secret
  session_secret:
    file: ./secrets/session_secret

volumes:
  pgdata:
  kc-data:
  kc-import:
